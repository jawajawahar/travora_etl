# Entrance fees for named sites, replacing category defaults where a source exists.
#
# Why this file exists: 2,236 of 2,245 places (99.6%) carried a category default
# fee (every heritage site LKR 3,000, every wildlife site LKR 6,000), and the
# budget was enforced against those invented numbers - Methodology 3.8.4 argues
# against exactly that for opening hours.
#
# Fields (LKR unless marked _usd):
#   foreign        foreign adult ticket
#   foreign_child  foreign child (CCF "half ticket")
#   saarc          SAARC-national adult, where published
#   local          Sri Lankan adult, where published
#   all_in_usd     national parks: entry + service charge + VAT per person,
#                  excluding jeep hire, where a source gives it
#   source         key into SOURCES below; confidence: official | secondary
#   conflict       sources disagree; every figure is kept in `note`
#
# USD figures are converted at the CCF table's own rate, 334 LKR = 1 USD
# (Sigiriya: USD 35.00 = LKR 11,690.00), so all rows share one rate. Prices
# follow the exchange rate and can change by gazette; re-verify before use.
#
# `match` lists name fragments used to find the place in the knowledge graph;
# `district` narrows the match. Matching is reviewed before anything is written.

usd_to_lkr: 334
accessed: 2026-09-27

sources:
  ccf:
    title: Central Cultural Fund - Prices of the Tickets for Archeological Sites and Museums (all-inclusive with 18% VAT)
    url: https://ccf.gov.lk/ticket-issuance/  (table served from https://ccf.gov.lk/is/index.php)
    file: data/references/entrance_fees/01_ccf_ticket_prices_2026-09-27.html
    confidence: official
    visitor: foreign (non-SAARC)
  slvoyo:
    title: Sri Lanka Entrance (Ticket) Fees for Foreign Tourists (2026 Updated Prices)
    url: https://slvoyo.com/complete-guide-to-sri-lanka-entrance-fees-for-foreign-tourists-2026-updated-prices/
    updated: 2026-04-03
    confidence: secondary
  tuktukrental:
    title: Entrance Fees Sri Lanka 2025-2026 - Full Ticket Price List
    url: https://tuktukrental.com/sri-lanka-entrance-fees/
    updated: 2026-03-30 (states 319 LKR per USD)
    confidence: secondary
  hopscotch:
    title: Entrance Fees for Sri Lanka's Top Attractions (2026 Guide)
    url: https://hopscotchtravels.com/entrance-fees-for-sri-lankas-top-attractions-2026-guide/
    updated: 2025-09-23
    confidence: secondary

