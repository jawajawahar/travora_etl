  - name: Sigiriya
    match: ["sigiriya"]
    exclude: ["museum"]
    district: Matale
    foreign: 11690
    foreign_child: 6680
    saarc: 6680          # USD 20 (slvoyo, tuktukrental)
    local: 120           # hopscotch; unverified
    source: ccf
  - name: Polonnaruwa ancient city
    match: ["polonnaruwa ancient", "polonnaruwa sacred", "gal vihara", "parakrama", "vatadage"]
    district: Polonnaruwa
    foreign: 10020
    foreign_child: 5010
    local: 120           # hopscotch; unverified
    source: ccf
  - name: Anuradhapura sacred city
